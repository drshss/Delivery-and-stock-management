# API service using an EXTERNAL PostgreSQL database (managed RDS / Supabase /
# Neon / Cloud SQL / a DB on another host). No Postgres container is run here.
#
# Setup:
#   1. cp .env.example .env  and set DATABASE_URL to your external Postgres
#      (include ?sslmode=require for managed providers).
#   2. docker compose up --build -d
#
# Multi-replica / zero-downtime deploys (recommended):
#   1. Set RUN_MIGRATIONS=0 in .env so app replicas never race on migrations.
#   2. Apply migrations ONCE before rolling out:  docker compose run --rm migrate
#   3. Deploy/scale the app:  docker compose up -d --build
services:
  api:
    image: adarshss/delivery-app:1.1.0
    restart: unless-stopped
    # Load the FULL .env into the container so DATABASE_URL (and everything else)
    # actually reaches the app. Without this the app falls back to its built-in
    # defaults — notably sqlite:///./delivery_app.db instead of your Postgres.
    env_file: .env
    environment: &app_environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}          # full external connection string
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-System Admin}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    ports:
      - "8000:8000"

  # One-off database migration runner. Applies `alembic upgrade head` then exits.
  # It is NOT started by `docker compose up` (it sits behind the "tools" profile),
  # so it never races the API replicas. Run it explicitly before a rollout:
  #   docker compose run --rm migrate
  # Reuses the API image and the exact same environment (the production-safety
  # checks in config.py require SECRET_KEY/DATABASE_URL/etc. even just to migrate).
  migrate:
    image: adarshss/delivery-app:1.1.0
    profiles: ["tools"]
    restart: "no"
    # Bypass docker-entrypoint.sh (which would also start Uvicorn) and run Alembic directly.
    entrypoint: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      <<: *app_environment

